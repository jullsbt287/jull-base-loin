<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#30201e">
<title>Reset Kata Sandi — JULL DEV</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 10% 15%,#ad5039,transparent 45%),radial-gradient(circle at 90% 75%,#8b4435,transparent 45%),linear-gradient(140deg,#542d27,#191820)}
.card{width:min(100%,410px);padding:28px 23px;border-radius:28px;border:1px solid #ffffff40;background:linear-gradient(145deg,#ffffff28,#ffffff0d);backdrop-filter:blur(25px);box-shadow:0 25px 90px #0008}
h1{text-align:center;font-size:25px;margin:0 0 8px}.sub{text-align:center;color:#e5ccc4;font-size:13px;line-height:1.7;margin:0 0 22px}label{display:block;margin:13px 0;color:#f1dcd5;font-size:12px}input{display:block;width:100%;margin-top:7px;padding:14px 15px;border-radius:14px;border:1px solid #ffffff40;background:#0003;color:#fff;outline:none;font-size:15px}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:13px;background:linear-gradient(120deg,#ff7453,#ffbf69);color:#42251d;font-weight:800;font-size:14px}button:disabled{opacity:.55}#msg{min-height:38px;margin:14px 0 0;text-align:center;color:#ffe0a8;font-size:12px;line-height:1.6}a{color:#ffd0b6;text-decoration:none}.back{display:block;text-align:center;margin-top:14px;font-size:12px}
</style></head><body><main class="card"><h1>Buat Kata Sandi Baru</h1><p class="sub">Masukkan kata sandi baru untuk akun JULL DEV kamu.</p>
<form id="resetForm"><label>Kata sandi baru<input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter" required></label><label>Ulangi kata sandi<input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Ketik ulang kata sandi" required></label><button id="save" type="submit">SIMPAN KATA SANDI</button></form><p id="msg" role="status">Memeriksa tautan pemulihan...</p><a class="back" href="/">Kembali ke halaman utama</a></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://brieoqwlilhlysjlwueg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyaWVvcXdsaWxobHlzamx3dWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzNDA5NTAsImV4cCI6MjEwOTkxNjk1MH0.VF5B_WMG8b29OmaMe0B5xt-WGHzHHLtgrRV_vkpT6xI';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('resetForm'), pass=document.getElementById('password'), confirmPass=document.getElementById('confirm'), save=document.getElementById('save'), msg=document.getElementById('msg');
let recoveryReady=false;
function message(t, bad=false){msg.textContent=t;msg.style.color=bad?'#ffaaa0':'#ffe0a8';}
function ready(){recoveryReady=true;form.hidden=false;message('Tautan valid. Silakan buat kata sandi baru.');}
form.hidden=true;
supabase.auth.onAuthStateChange((event, session)=>{if(event==='PASSWORD_RECOVERY' || (session && location.hash.includes('type=recovery'))) ready();});
const {data,error}=await supabase.auth.getSession();
if(error) message('Gagal memeriksa tautan: '+error.message,true);
else if(data.session && (location.hash.includes('type=recovery') || location.search.includes('type=recovery'))) ready();
else if(data.session) ready();
else message('Tautan reset tidak valid atau sudah kedaluwarsa. Minta link baru dari halaman login.',true);
form.addEventListener('submit',async e=>{e.preventDefault();if(!recoveryReady){message('Tautan pemulihan belum valid. Minta link baru.',true);return;}if(pass.value.length<6){message('Kata sandi minimal 6 karakter.',true);return;}if(pass.value!==confirmPass.value){message('Konfirmasi kata sandi tidak sama.',true);return;}save.disabled=true;save.textContent='MENYIMPAN...';try{const {error}=await supabase.auth.updateUser({password:pass.value});if(error)throw error;message('Kata sandi berhasil diubah. Silakan kembali ke halaman login.');form.hidden=true;await supabase.auth.signOut();history.replaceState(null,document.title,location.pathname);}catch(err){message('Gagal mengubah kata sandi: '+(err.message||'Coba minta link baru.'));}finally{save.disabled=false;save.textContent='SIMPAN KATA SANDI';}});
</script></body></html>
